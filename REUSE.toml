version = 1
SPDX-PackageName = "cgnd.dev"
SPDX-PackageSupplier = "Common Ground Electronics <https://cgnd.dev>"
SPDX-PackageDownloadLocation = "https://github.com/common-ground-electronics/cgnd.dev"

[[annotations]]
path = [
    "**.md",
    "**.png",
    "**.jpg",
    "**.jpeg",
    "**.webp",
    "**.ico",
    "**.drawio",
    "**.monopic",
    "**.svg",
    "**.html",
    "**.pdf",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "Common Ground Electronics <https://cgnd.dev>"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = ["static/manifest.json", "**.scss"]
precedence = "aggregate"
SPDX-FileCopyrightText = "Common Ground Electronics <https://cgnd.dev>"
SPDX-License-Identifier = "MIT or Apache-2.0"

[[annotations]]
path = ["static/fonts/Archivo-*.woff2", "static/fonts/OFL-Archivo.txt"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2020 The Archivo Project Authors (https://github.com/Omnibus-Type/Archivo)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["static/fonts/MonaspaceNeon-*.woff2", "static/fonts/LICENSE-Monaspace.txt"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2023 GitHub (https://github.com/githubnext/monaspace)"
SPDX-License-Identifier = "OFL-1.1"
